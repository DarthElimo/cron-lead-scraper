<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Scraper — AutoRise AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:     #18181B;
      --bg-dark:     #111113;
      --bg-elevated: #1C1C1F;
      --bg-surface:  #222228;
      --text:        #FAF9F6;
      --text-60:     rgba(250,249,246,0.60);
      --text-40:     rgba(250,249,246,0.40);
      --accent:      #C9A962;
      --accent-08:   rgba(201,169,98,0.08);
      --accent-18:   rgba(201,169,98,0.18);
      --accent-30:   rgba(201,169,98,0.30);
      --btn-text:    #111113;
      --error:       #DC5050;
      --error-08:    rgba(220,80,80,0.08);
      --error-30:    rgba(220,80,80,0.30);
      --success:     #6EBF8B;
      --success-08:  rgba(110,191,139,0.08);
      --success-30:  rgba(110,191,139,0.30);
      --radius:      12px;
      --spring:      cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    /* ── Logo ─────────────────────────────── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .logo svg { width: 28px; height: 28px; }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.14em;
      color: var(--text);
    }

    /* ── Card ─────────────────────────────── */
    .card {
      background: var(--bg-surface);
      border: 1px solid rgba(250,249,246,0.07);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 640px;
      position: relative;
      overflow: hidden;
      transition: max-width 0.3s ease;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, var(--accent-08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Heading ──────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 15px;
      color: var(--text-60);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ── Mode Tabs ────────────────────────── */
    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
    }
    .mode-tab {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: 1px solid rgba(250,249,246,0.09);
      background: transparent;
      color: var(--text-60);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .mode-tab:hover { border-color: var(--accent-30); color: var(--text); }
    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-text);
    }

    /* ── Form fields ──────────────────────── */
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-60);
      margin-bottom: 7px;
      text-transform: uppercase;
    }
    input[type="text"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid rgba(250,249,246,0.09);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s linear;
    }
    input:focus { border-color: var(--accent-30); }
    input::placeholder { color: rgba(250,249,246,0.22); }

    /* ── Toggle ───────────────────────────── */
    .toggle-wrap {
      background: var(--bg-elevated);
      border: 1px solid rgba(250,249,246,0.09);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s linear;
      margin-bottom: 28px;
    }
    .toggle-wrap:hover { border-color: var(--accent-30); }
    .toggle-info { flex: 1; padding-right: 16px; }
    .toggle-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .toggle-sub   { font-size: 12px; color: var(--text-40); margin-top: 2px; }

    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--bg-dark);
      border: 1px solid rgba(250,249,246,0.12);
      border-radius: 24px;
      transition: background 0.22s var(--spring), border-color 0.22s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: rgba(250,249,246,0.3);
      border-radius: 50%;
      transition: transform 0.22s var(--spring), background 0.22s;
    }
    input:checked + .slider { background: var(--accent-18); border-color: var(--accent-30); }
    input:checked + .slider::before { transform: translateX(18px); background: var(--accent); }

    /* ── Button ───────────────────────────── */
    .btn {
      width: 100%;
      background: var(--accent);
      color: var(--btn-text);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: none;
      border-radius: var(--radius);
      padding: 13px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.22s var(--spring), box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(201,169,98,0.18), 0 0 0 0 rgba(201,169,98,0);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 24px rgba(201,169,98,0.28), 0 0 0 0 rgba(201,169,98,0);
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled {
      background: rgba(201,169,98,0.25);
      color: rgba(201,169,98,0.5);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Status ───────────────────────────── */
    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }
    .status.info    { background: var(--accent-08);  border: 1px solid var(--accent-30);  color: var(--accent);  display: block; }
    .status.success { background: var(--success-08); border: 1px solid var(--success-30); color: var(--success); display: block; }
    .status.error   { background: var(--error-08);   border: 1px solid var(--error-30);   color: var(--error);   display: block; }
    .run-link { color: inherit; font-weight: 600; }

    /* ── API section ──────────────────────── */
    .api-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(250,249,246,0.06);
    }
    .api-section summary {
      font-size: 12px;
      color: var(--text-40);
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .api-section summary:hover { color: var(--text-60); }
    .api-section .field { margin-top: 16px; margin-bottom: 0; }

    /* ── Bulk Mode ────────────────────────── */
    .list-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 4px;
    }
    @media (max-width: 520px) {
      .list-grid { grid-template-columns: 1fr; }
    }

    .list-editor {
      background: var(--bg-elevated);
      border: 1px solid rgba(250,249,246,0.09);
      border-radius: var(--radius);
      padding: 14px;
    }
    .list-editor-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-60);
      margin-bottom: 12px;
    }

    /* Single-entry add row */
    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .add-row input {
      flex: 1;
      font-size: 14px;
      padding: 8px 11px;
    }
    .add-btn {
      background: var(--accent-18);
      border: 1px solid var(--accent-30);
      border-radius: 8px;
      color: var(--accent);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 18px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s var(--spring);
      line-height: 1;
    }
    .add-btn:hover { background: var(--accent-30); transform: scale(1.08); }
    .add-btn:active { transform: scale(0.96); }

    /* Paste-many area */
    .paste-area {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid rgba(250,249,246,0.07);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 13px;
      padding: 9px 11px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 6px;
    }
    .paste-area:focus { border-color: var(--accent-30); }
    .paste-area::placeholder { color: rgba(250,249,246,0.20); }

    .paste-add-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(250,249,246,0.09);
      border-radius: 8px;
      color: var(--text-60);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 0;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-bottom: 12px;
    }
    .paste-add-btn:hover { border-color: var(--accent-30); color: var(--accent); }

    /* Tag list */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
    }
    .tag-empty {
      font-size: 12px;
      color: var(--text-40);
      font-style: italic;
      align-self: center;
    }
    .tag {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-08);
      border: 1px solid var(--accent-18);
      border-radius: 6px;
      padding: 3px 8px 3px 10px;
      font-size: 13px;
      color: var(--text);
      max-width: 100%;
    }
    .tag-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }
    .tag-remove {
      background: none;
      border: none;
      color: var(--text-40);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .tag-remove:hover { color: var(--error); }

    /* Combination count */
    .combo-count {
      text-align: center;
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      padding: 14px 0 18px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .combo-count.visible { opacity: 1; }

    @keyframes spin { to { stroke-dashoffset: -28; } }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" stroke="#C9A962" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 6V4"/>
      <path d="M6.34 8.34 4.93 6.93"/>
      <path d="M4 14H2"/>
      <path d="M21.66 8.34l1.41-1.41"/>
      <path d="M24 14h2"/>
      <path d="M7 19a7 7 0 0 1 14 0"/>
      <path d="M4 22h20"/>
      <path d="M9 22v-1"/>
      <path d="M14 22v-2"/>
      <path d="M19 22v-1"/>
    </svg>
    <span class="logo-text">AUTORISE AI</span>
  </div>

  <!-- Card -->
  <div class="card">
    <p class="section-label">Lead-Generierung</p>
    <h1>Leads finden.</h1>
    <p class="subtitle">Suchbegriff eingeben — Ergebnisse landen direkt im Google Sheet.</p>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabSingle" onclick="switchMode('single')">Einzeln</button>
      <button class="mode-tab" id="tabBulk" onclick="switchMode('bulk')">Bulk Run</button>
    </div>

    <!-- ── Single Mode ── -->
    <div id="singleMode">
      <div class="field">
        <label for="keyword">Branche</label>
        <input id="keyword" type="text" placeholder="z.B. Heizung Sanitär" />
      </div>

      <div class="field">
        <label for="location">Standort</label>
        <input id="location" type="text" placeholder="z.B. Stuttgart" />
      </div>
    </div>

    <!-- ── Bulk Mode ── -->
    <div id="bulkMode" style="display:none">
      <div class="list-grid">

        <!-- Branchen -->
        <div class="list-editor">
          <div class="list-editor-title">Branchen</div>

          <div class="add-row">
            <input type="text" id="kwInput" placeholder="z.B. Heizungsbauer" onkeydown="if(event.key==='Enter') addKeyword()" />
            <button class="add-btn" onclick="addKeyword()" title="Hinzufügen">+</button>
          </div>

          <textarea class="paste-area" id="kwPaste" rows="3" placeholder="Mehrere einfügen&#10;(einer pro Zeile)"></textarea>
          <button class="paste-add-btn" onclick="pasteKeywords()">Alle hinzufügen</button>

          <div class="tag-list" id="kwTags">
            <span class="tag-empty">Noch keine Einträge</span>
          </div>
        </div>

        <!-- Standorte -->
        <div class="list-editor">
          <div class="list-editor-title">Standorte</div>

          <div class="add-row">
            <input type="text" id="locInput" placeholder="z.B. Stuttgart" onkeydown="if(event.key==='Enter') addLocation()" />
            <button class="add-btn" onclick="addLocation()" title="Hinzufügen">+</button>
          </div>

          <textarea class="paste-area" id="locPaste" rows="3" placeholder="Mehrere einfügen&#10;(einer pro Zeile)"></textarea>
          <button class="paste-add-btn" onclick="pasteLocations()">Alle hinzufügen</button>

          <div class="tag-list" id="locTags">
            <span class="tag-empty">Noch keine Einträge</span>
          </div>
        </div>

      </div>

      <!-- Combination count -->
      <div class="combo-count" id="comboCount"></div>
    </div>

    <!-- ── Shared Settings ── -->
    <div class="field">
      <label for="count">Anzahl Leads pro Suche (max. 500)</label>
      <input id="count" type="number" value="20" min="1" max="500" />
    </div>

    <label>E-Mail-Suche</label>
    <label class="toggle-wrap" for="emailToggle">
      <div class="toggle-info">
        <div class="toggle-title">Website nach E-Mail durchsuchen</div>
        <div class="toggle-sub">Impressum · Kontakt · About — dauert länger</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="emailToggle" />
        <span class="slider"></span>
      </label>
    </label>

    <!-- Single Run Button -->
    <button class="btn" id="runBtn" onclick="triggerScraper()" style="display:flex">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5,3 13,8 5,13"/>
      </svg>
      Scraping starten
    </button>

    <!-- Bulk Run Button -->
    <button class="btn" id="bulkBtn" onclick="triggerBulkScraper()" style="display:none">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="5" height="5" rx="1"/>
        <rect x="9" y="2" width="5" height="5" rx="1"/>
        <rect x="2" y="9" width="5" height="5" rx="1"/>
        <rect x="9" y="9" width="5" height="5" rx="1"/>
      </svg>
      Bulk-Scraping starten
    </button>

    <div id="status" class="status"></div>

    <details class="api-section">
      <summary>Einstellungen</summary>
      <div class="field">
        <label for="apiKey">Trigger.dev Secret Key</label>
        <input id="apiKey" type="password" placeholder="tr_dev_..." value="tr_dev_gz3CuArCnwA78IFq0z0z" />
      </div>
    </details>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────
    let keywords  = [];
    let locations = [];
    let currentMode = 'single';

    // ── Mode Switch ────────────────────────────────────────
    function switchMode(mode) {
      currentMode = mode;
      const isBulk = mode === 'bulk';

      document.getElementById('singleMode').style.display = isBulk ? 'none' : 'block';
      document.getElementById('bulkMode').style.display   = isBulk ? 'block' : 'none';
      document.getElementById('runBtn').style.display     = isBulk ? 'none' : 'flex';
      document.getElementById('bulkBtn').style.display    = isBulk ? 'flex' : 'none';

      document.getElementById('tabSingle').classList.toggle('active', !isBulk);
      document.getElementById('tabBulk').classList.toggle('active', isBulk);

      document.getElementById('status').className = 'status';
    }

    // ── Keyword list helpers ───────────────────────────────
    function addKeyword() {
      const input = document.getElementById('kwInput');
      const val   = input.value.trim();
      if (!val) return;
      addToList(keywords, val);
      input.value = '';
      renderKeywords();
    }

    function pasteKeywords() {
      const area  = document.getElementById('kwPaste');
      const lines = area.value.split('\n').map(s => s.trim()).filter(Boolean);
      lines.forEach(l => addToList(keywords, l));
      area.value = '';
      renderKeywords();
    }

    function removeKeyword(index) {
      keywords.splice(index, 1);
      renderKeywords();
    }

    function renderKeywords() {
      renderList('kwTags', keywords, removeKeyword);
      updateComboCount();
    }

    // ── Location list helpers ──────────────────────────────
    function addLocation() {
      const input = document.getElementById('locInput');
      const val   = input.value.trim();
      if (!val) return;
      addToList(locations, val);
      input.value = '';
      renderLocations();
    }

    function pasteLocations() {
      const area  = document.getElementById('locPaste');
      const lines = area.value.split('\n').map(s => s.trim()).filter(Boolean);
      lines.forEach(l => addToList(locations, l));
      area.value = '';
      renderLocations();
    }

    function removeLocation(index) {
      locations.splice(index, 1);
      renderLocations();
    }

    function renderLocations() {
      renderList('locTags', locations, removeLocation);
      updateComboCount();
    }

    // ── Shared list utilities ──────────────────────────────
    function addToList(arr, value) {
      // Deduplicate case-insensitively
      const lower = value.toLowerCase();
      if (!arr.some(e => e.toLowerCase() === lower)) {
        arr.push(value);
      }
    }

    function renderList(containerId, arr, removeFn) {
      const container = document.getElementById(containerId);
      if (arr.length === 0) {
        container.innerHTML = '<span class="tag-empty">Noch keine Einträge</span>';
        return;
      }
      container.innerHTML = arr.map((item, i) =>
        `<span class="tag">
          <span class="tag-text" title="${escHtml(item)}">${escHtml(item)}</span>
          <button class="tag-remove" onclick="${removeFn.name}(${i})" title="Entfernen">×</button>
        </span>`
      ).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function updateComboCount() {
      const total = keywords.length * locations.length;
      const el    = document.getElementById('comboCount');
      if (total === 0) {
        el.textContent = '';
        el.classList.remove('visible');
      } else {
        el.innerHTML = `<strong>${total}</strong>&nbsp;Kombination${total !== 1 ? 'en' : ''} werden gestartet`;
        el.classList.add('visible');
      }
    }

    // ── Single Run ─────────────────────────────────────────
    async function triggerScraper() {
      const keyword     = document.getElementById('keyword').value.trim();
      const location    = document.getElementById('location').value.trim();
      const count       = parseInt(document.getElementById('count').value, 10);
      const emailSearch = document.getElementById('emailToggle').checked;
      const apiKey      = document.getElementById('apiKey').value.trim();
      const btn         = document.getElementById('runBtn');

      if (!keyword || !location) {
        showStatus('Bitte Branche und Standort eingeben.', 'error'); return;
      }
      if (isNaN(count) || count < 1 || count > 500) {
        showStatus('Anzahl muss zwischen 1 und 500 liegen.', 'error'); return;
      }

      btn.disabled = true;
      btn.innerHTML = spinnerHtml('Läuft…');
      showStatus('Task wird gestartet…', 'info');

      try {
        const res = await fetch('https://api.trigger.dev/api/v1/tasks/scrape-leads/trigger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ payload: { keyword, location, count, emailSearch } }),
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(`Fehler: ${data.error || JSON.stringify(data)}`, 'error');
        } else {
          const runUrl = `https://cloud.trigger.dev/runs/${data.id}`;
          showStatus(
            `Gestartet — ${count} Leads werden gesucht.<br>
            <a class="run-link" href="${runUrl}" target="_blank">Run live verfolgen →</a>`,
            'success'
          );
        }
      } catch (err) {
        showStatus(`Verbindungsfehler: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,3 13,8 5,13"/></svg> Scraping starten`;
      }
    }

    // ── Bulk Run ───────────────────────────────────────────
    async function triggerBulkScraper() {
      const count       = parseInt(document.getElementById('count').value, 10);
      const emailSearch = document.getElementById('emailToggle').checked;
      const apiKey      = document.getElementById('apiKey').value.trim();
      const btn         = document.getElementById('bulkBtn');

      if (keywords.length === 0 || locations.length === 0) {
        showStatus('Bitte mindestens eine Branche und einen Standort eingeben.', 'error'); return;
      }
      if (isNaN(count) || count < 1 || count > 500) {
        showStatus('Anzahl muss zwischen 1 und 500 liegen.', 'error'); return;
      }

      const total = keywords.length * locations.length;
      btn.disabled = true;
      btn.innerHTML = spinnerHtml(`${total} Runs werden gestartet…`);
      showStatus('Bulk-Task wird gestartet…', 'info');

      try {
        const res = await fetch('https://api.trigger.dev/api/v1/tasks/bulk-scrape/trigger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ payload: { keywords, locations, count, emailSearch } }),
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(`Fehler: ${data.error || JSON.stringify(data)}`, 'error');
        } else {
          const runUrl = `https://cloud.trigger.dev/runs/${data.id}`;
          showStatus(
            `<strong>${total} Kombinationen</strong> wurden gestartet.<br>
            ${keywords.length} Branchen × ${locations.length} Standorte<br>
            <a class="run-link" href="${runUrl}" target="_blank">Orchestrator-Run verfolgen →</a>`,
            'success'
          );
        }
      } catch (err) {
        showStatus(`Verbindungsfehler: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg> Bulk-Scraping starten`;
      }
    }

    // ── Utilities ──────────────────────────────────────────
    function showStatus(html, type) {
      const el = document.getElementById('status');
      el.innerHTML = html;
      el.className = `status ${type}`;
    }

    function spinnerHtml(label) {
      return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="6" stroke-dasharray="28" stroke-dashoffset="10" style="animation:spin 0.8s linear infinite;transform-origin:center"/></svg> ${label}`;
    }
  </script>
</body>
</html>
